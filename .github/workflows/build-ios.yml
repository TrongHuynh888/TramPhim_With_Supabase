name: iOS Build (IPA)

on:
  push:
    branches: [ "build-ipa" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: TramPhim-RN/package-lock.json

      - name: 🏗 Setup Expo
        uses: expo/expo-github-action@v8
        with:
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        working-directory: TramPhim-RN
        run: npm install

      - name: 🔨 Install EAS CLI
        run: npm install -g eas-cli

      - name: 🔨 Build IPA (Local)
        working-directory: TramPhim-RN
        run: |
          # Build IPA for simulator (no certs needed) or development
          # Note: Real IPA requires Apple Credentials. 
          # Using 'preview' profile with simulator: true in eas.json would produce a .app.
          # Here we try to produce a build.ipa.
          eas build --platform ios --profile preview --local --non-interactive --output=./build.ipa
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📂 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tramphim-ios-ipa
          path: TramPhim-RN/build.ipa
